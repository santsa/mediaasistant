spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
  application:
    name: mediaassistant
  profiles:
    include:
      # - aws
      # for local development or devtools in github, you can use the following profiles to enable different vector stores:
      # - ollama
      # - gemini
      # - remote #in dev tools
      # - local #in local computer
  datasource:
    url: jdbc:postgresql://localhost:5432/mediaassistant
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://solitary-cauldron-rxj9xwgj5359rg-8090.app.github.dev/realms/medassistant
          #issuer-uri: http://localhost:8090/realms/medassistant
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      chroma:
        url: http://localhost:8000
        #collection-name: medassistant
        #initialize-schema: true
    mcp:
      client:
        stdio:
          connections:
            filesystem:
              command: /home/codespace/nvm/current/bin/mcp-server-filesystem
              args:
                - "/workspaces/mediaasistant/src/main/resources/prompts"
              env:
                PATH: /home/codespace/nvm/current/bin:/usr/bin:/bin
            github:
              command: /home/codespace/nvm/current/bin/mcp-server-github
              args:
                - ""
              env:
                GITHUB_PERSONAL_ACCESS_TOKEN: ${MCP_GITHUB_TOKEN}
                PATH: /home/codespace/nvm/current/bin:/usr/bin:/bin
      server:    
        name: medassistant-mcp
        version: 1.0.0
        protocol: STATELESS