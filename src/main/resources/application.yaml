spring:
  application:
    name: mediaassistant
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite
            temperature: 0.7
            maxOutputTokens: 1024
            topP: 0.8
            topK: 40
  datasource:
    url: jdbc:postgresql://localhost:5432/mediaassistant
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
