spring:
  application:
    name: mediaassistant
  profiles:
    include:
      - ollama
      - gemini
  datasource:
    url: jdbc:postgresql://localhost:5432/mediaassistant
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://expert-space-rotary-phone-rw4995vjg43xvgg-8090.app.github.dev/realms/medassistant
          #issuer-uri: http://localhost:8090/realms/medassistant
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: medassistant
        initialize-schema: true