spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
  application:
    name: mediaassistant
  profiles:
    include:
      - ollama
      - gemini
      - remote
  datasource:
    url: jdbc:postgresql://localhost:5432/mediaassistant
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://haunted-spooky-wand-rw49955grvfr59-8090.app.github.dev/realms/medassistant
          #issuer-uri: http://localhost:8090/realms/medassistant
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      chroma:
        url: http://localhost:8000
        #collection-name: medassistant
        #initialize-schema: true