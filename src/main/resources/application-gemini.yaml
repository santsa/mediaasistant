spring:
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          model: gemini-3.1-flash-lite
          temperature: 0.2
          max-output-tokens: 2048
          top-p: 0.85
        embedding:
          api-key: ${GOOGLE_GENAI_API_KEY}
          text:
            model: text-embedding-004
